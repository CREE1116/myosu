[package]
name = "gomoku-rl"
version = "0.1.0"
edition = "2021"

[lib]
name = "gomoku_mcts"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
